<!--
  Copy-ready <head> block for plain HTML or any templating engine.
  Replace every {{ placeholder }} from seo.config or page data. Never ship placeholders.
  Delete blocks that do not apply (article tags, hreflang, noindex).
-->
<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ pageTitle }}</title>
  <meta name="description" content="{{ pageDescription }}">
  <link rel="canonical" href="{{ canonicalUrl }}">

  <!-- Indexable page: -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <!-- Non-indexable page (search, cart, thank-you, staging) use instead:
  <meta name="robots" content="noindex, follow"> -->

  <!-- Verification (only if tokens provided by the SEO specialist) -->
  <!-- <meta name="google-site-verification" content="{{ googleToken }}"> -->
  <!-- <meta name="msvalidate.01" content="{{ bingToken }}"> -->

  <!-- Multi-language sites only: self-reference + all alternates + x-default -->
  <!-- <link rel="alternate" hreflang="en" href="{{ enUrl }}">
  <link rel="alternate" hreflang="fr" href="{{ frUrl }}">
  <link rel="alternate" hreflang="x-default" href="{{ defaultUrl }}"> -->

  <!-- Open Graph -->
  <meta property="og:type" content="{{ ogType }}"> <!-- website | article | product -->
  <meta property="og:site_name" content="{{ siteName }}">
  <meta property="og:title" content="{{ ogTitle }}">
  <meta property="og:description" content="{{ ogDescription }}">
  <meta property="og:url" content="{{ canonicalUrl }}">
  <meta property="og:image" content="{{ ogImageAbsoluteUrl }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ ogImageAlt }}">
  <meta property="og:locale" content="{{ ogLocale }}">

  <!-- Article pages only -->
  <!-- <meta property="article:published_time" content="{{ publishedISO }}">
  <meta property="article:modified_time" content="{{ modifiedISO }}">
  <meta property="article:author" content="{{ authorUrl }}"> -->

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <!-- <meta name="twitter:site" content="{{ twitterHandle }}"> -->
  <meta name="twitter:title" content="{{ ogTitle }}">
  <meta name="twitter:description" content="{{ ogDescription }}">
  <meta name="twitter:image" content="{{ ogImageAbsoluteUrl }}">
  <meta name="twitter:image:alt" content="{{ ogImageAlt }}">

  <!-- Icons and manifest -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="{{ themeColor }}">

  <!-- Feeds -->
  <!-- <link rel="alternate" type="application/rss+xml" title="{{ siteName }} feed" href="/rss.xml"> -->

  <!-- Performance: only critical origins and the LCP asset -->
  <!-- <link rel="preconnect" href="https://cdn.example.com" crossorigin> -->
  <!-- <link rel="preload" href="/fonts/main.woff2" as="font" type="font/woff2" crossorigin> -->
  <!-- <link rel="preload" as="image" href="{{ lcpImage }}" fetchpriority="high"> -->

  <link rel="stylesheet" href="/css/main.css">

  <!-- JSON-LD (build from the same data as the page; escape "<" as <) -->
  <script type="application/ld+json">{{ jsonLd }}</script>
</head>
